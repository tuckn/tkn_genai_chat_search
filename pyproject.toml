[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tkn-genai-chat-search"
version = "0.1.0"
description = "Search local Codex and Claude Code chat logs read-only and return quoted evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tuckn" }]
dependencies = [
  "PyYAML>=6,<7",
  "zstandard>=0.23,<1",
]

[project.urls]
Repository = "https://github.com/tuckn/tkn_genai_chat_search"

[project.scripts]
tkn-genai-chat-search = "tkn_genai_chat_search.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tkn_genai_chat_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tkn_genai_chat_search"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "zstandard"
ignore_missing_imports = true
